          &lt;button class=&quot;edge dashed&quot; data-key=&quot;system-edge-tt&quot;&gt;&lt;b&gt;⇢&lt;/b&gt;&lt;small&gt;runtime handoff&lt;br&gt;not verified&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;node&quot; data-key=&quot;system-instagram&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Instagram Crawler&lt;/span&gt;&lt;strong&gt;PostgreSQL reels + creators&lt;/strong&gt;&lt;small&gt;ClickHouse tables/API reads exist; PG → CH synchronization is unknown&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;edge dashed&quot; data-key=&quot;system-edge-ig&quot;&gt;&lt;b&gt;⇢&lt;/b&gt;&lt;small&gt;bridge unknown&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;node&quot; data-key=&quot;system-amazon&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Amazon Crawler&lt;/span&gt;&lt;strong&gt;PostgreSQL amazon_product&lt;/strong&gt;&lt;small&gt;Product API SQL points to deviantly.amazon_products; mapping not proven&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;edge dashed&quot; data-key=&quot;system-edge-amz&quot;&gt;&lt;b&gt;⇢&lt;/b&gt;&lt;small&gt;schema mismatch /&lt;br&gt;include disabled&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;node&quot; data-key=&quot;system-commerce-api&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Commerce API&lt;/span&gt;&lt;strong&gt;Postgres deviantly.* repositories&lt;/strong&gt;&lt;small&gt;Product/shop/brand/creator paths; Valv PG catalog visibility is partial&lt;/small&gt;&lt;/button&gt;
        &lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;lane&quot;&gt;&lt;div class=&quot;lane-title&quot;&gt;Operational metadata, external services and limits&lt;/div&gt;&lt;div class=&quot;flow&quot;&gt;
          &lt;button class=&quot;node&quot; data-key=&quot;system-postgres&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Postgres&lt;/span&gt;&lt;strong&gt;App + crawler metadata&lt;/strong&gt;&lt;small&gt;Several repositories use DATABASE_URL; same physical DB is deployment-dependent&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;node&quot; data-key=&quot;system-external&quot;&gt;&lt;span class=&quot;kind&quot;&gt;External dependencies&lt;/span&gt;&lt;strong&gt;EchoTik · MCP · AI providers · report service&lt;/strong&gt;&lt;small&gt;Separate endpoints, credentials and runtime health&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;node&quot; data-key=&quot;system-catalog&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Live evidence boundary&lt;/span&gt;&lt;strong&gt;Valv catalog != full DDL&lt;/strong&gt;&lt;small&gt;PG exposure is partial; ClickHouse describe confirms columns, not lineage/engines&lt;/small&gt;&lt;/button&gt;
        &lt;/div&gt;&lt;/div&gt;

  &lt;script&gt;
    (()=&gt;{
      const root=document.getElementById(&#x27;deviantly-map&#x27;);
      const inspector=root.querySelector(&#x27;#map-inspector&#x27;);
      const firstFlow=root.querySelector(&#x27;.flow&#x27;);
      const reserveDetailSlot=flow=&gt;{let slot=flow.querySelector(&#x27;.detail-slot&#x27;);if(!slot){slot=document.createElement(&#x27;div&#x27;);slot.className=&#x27;detail-slot&#x27;;flow.prepend(slot);}return slot;};
      root.querySelectorAll(&#x27;.flow&#x27;).forEach(reserveDetailSlot);
      reserveDetailSlot(firstFlow).append(inspector);
      const info={
        &#x27;ui-video&#x27;:[&#x27;Video Explorer&#x27;,&#x27;Code-derived&#x27;,&#x27;React feature builds URL parameters from filters and calls the Go video endpoint. The server selects TikTok, YouTube, Instagram, or combined result paths.&#x27;,&#x27;UI → API&#x27;,&#x27;deviantly-ui/src/features/videos/videos-page.tsx · deviantly-server/internal/video/handler.go&#x27;],
        &#x27;edge-ui-api&#x27;:[&#x27;UI → API request&#x27;,&#x27;Code-derived&#x27;,&#x27;Browser fetch uses the shared API base helper. On development port 5173 and production UI port 8080, frontend code targets the same host on port 8081; other deployments use relative paths.&#x27;,&#x27;Network boundary&#x27;,&#x27;JSON request/response over HTTP&#x27;],
        &#x27;go-api&#x27;:[&#x27;Go API router&#x27;,&#x27;Code-derived&#x27;,&#x27;Chi router listens on PORT (default 8081). Request ID, real IP, CORS, request logging, panic recovery and v1 compression wrap route handling. /api/v1 mounts products, shops, creators, videos, trend, live-feed, auth, AI and related handlers.&#x27;,&#x27;Runtime&#x27;,&#x27;deviantly-server/cmd/api/main.go&#x27;],
        &#x27;edge-api-video&#x27;:[&#x27;Router → video handler&#x27;,&#x27;Code-derived&#x27;,&#x27;Go mounts the video handler under /api/v1/videos. Handler binds request query parameters into video service inputs and writes a JSON response.&#x27;,&#x27;Route&#x27;,&#x27;GET /api/v1/videos and detail/thumbnail subroutes&#x27;],
        &#x27;video-handler&#x27;:[&#x27;Video query service&#x27;,&#x27;Code-derived&#x27;,&#x27;GET /api/v1/videos parses platform, country/category, metric bounds, date range, keyword search, sort and pagination. It may expand query terms with an external AI call; network or response failures fall back to tokenized input. Queries go to ClickHouse over HTTP. If query paths return no rows or fail, service can return an in-code sample list; some responses also use hard-coded totals.&#x27;,&#x27;Primary SQL targets&#x27;,&#x27;default.videos_500plus / videos_flat · youtube_shorts_1000plus · instagram_reels (+ metrics)&#x27;],
        &#x27;edge-video-ch&#x27;:[&#x27;Video service → ClickHouse&#x27;,&#x27;Code-derived&#x27;,&#x27;Service builds platform-specific SQL, sends it to the ClickHouse HTTP interface with configured endpoint/user/password, parses JSONEachRow, then maps rows into response items. Table fallback and sample fallback paths exist.&#x27;,&#x27;Network boundary&#x27;,&#x27;ClickHouse HTTP; credentials should come from environment configuration.&#x27;],
        &#x27;clickhouse&#x27;:[&#x27;ClickHouse&#x27;,&#x27;Database-verified&#x27;,&#x27;Valv currently exposes normalized video, creator, metric, snapshot, trend, and raw Kafka-named resources. It is the API’s large analytical read store. Valv schema descriptions confirm columns, not table engines, MV definitions, Kafka engine settings, or exact producer-to-table wiring.&#x27;,&#x27;Example resources&#x27;,&#x27;videos_500plus · youtube_shorts_1000plus · instagram_reels · trend_metrics&#x27;],
        &#x27;ui-trend&#x27;:[&#x27;Trend matrix UI&#x27;,&#x27;Code-derived&#x27;,&#x27;Matrix view fetches /api/v1/trend with search and platform filters. While visible it polls /api/v1/trend/live every 3.2 seconds and merges recent arrivals into UI state.&#x27;,&#x27;Call cadence&#x27;,&#x27;Initial/filtered fetch + 3.2-second live poll&#x27;],
        &#x27;trend-static&#x27;:[&#x27;Trend list handler&#x27;,&#x27;Code-derived&#x27;,&#x27;GET /api/v1/trend filters in-memory MasterClusters by platform and text; response KPIs are constants except the filtered cluster count. GET /live rotates samples from those same clusters and derives velocity from wall-clock seconds. This response path does not query ClickHouse.&#x27;,&#x27;Important behavior&#x27;,&#x27;The “live” endpoint is simulated/rotating response data, not crawler event telemetry.&#x27;],
        &#x27;edge-trend-list&#x27;:[&#x27;Trend UI → trend list&#x27;,&#x27;Code-derived&#x27;,&#x27;Browser fetches /api/v1/trend?q=…&amp;platform=… . Go filters MasterClusters and returns cluster objects, telemetry and fixed corpus counters.&#x27;,&#x27;Route&#x27;,&#x27;GET /api/v1/trend&#x27;],
        &#x27;edge-trend-ch&#x27;:[&#x27;trend_metrics → Trend matrix&#x27;,&#x27;Unresolved pipeline gap&#x27;,&#x27;Valv confirms a rich ClickHouse trend_metrics table, but the current matrix handler reads MasterClusters in memory. No handler query mapping this table to the matrix response was found. The data may still be used by another job or surface.&#x27;,&#x27;Database fields&#x27;,&#x27;cluster_name, video_count, avg_views, opportunity_score, acceleration_pct, stage, sample_urls, hashtags&#x27;],
        &#x27;trend-table&#x27;:[&#x27;trend_metrics&#x27;,&#x27;Database-verified&#x27;,&#x27;Live ClickHouse catalog describes cluster aggregates, opportunity/acceleration scores, stage, sample URLs/IDs, hashtags and suggested words. A table’s presence does not mean the matrix endpoint serves it.&#x27;,&#x27;Evidence&#x27;,&#x27;Valv describe_resource&#x27;],
        &#x27;ui-leaderboard&#x27;:[&#x27;Leaderboard and hashtag UI&#x27;,&#x27;Code-derived&#x27;,&#x27;Separate components call trend leaderboard, hashtags and dates endpoints. Controls send board, region, time_type, time_range, search, page and limit.&#x27;,&#x27;Route family&#x27;,&#x27;/api/v1/trend/leaderboard · /hashtags · /dates&#x27;],
        &#x27;edge-leaderboard-pg&#x27;:[&#x27;Trend analytics → EchoTik PostgreSQL&#x27;,&#x27;Code-derived&#x27;,&#x27;Separate EchoTik repository issues parameterized queries against leaderboard_videos. It chooses available dates, applies filters, fetches page data JSON, parses fields, and constructs fallback thumbnail URLs. Count-query failures are currently treated as zero.&#x27;,&#x27;Database&#x27;,&#x27;ECHOTIK_DATABASE_URL (separate pool)&#x27;],
        &#x27;echotik-pg&#x27;:[&#x27;EchoTik PostgreSQL&#x27;,&#x27;Code-derived&#x27;,&#x27;A second PostgreSQL pool backs leaderboard snapshots, hashtags, stats and dates. This is separate from the app metadata pool and from ClickHouse. Valv’s listed PostgreSQL catalog does not establish that this external database is exposed there.&#x27;,&#x27;Source tables&#x27;,&#x27;leaderboard_videos (code query)&#x27;],
        &#x27;ui-commerce&#x27;:[&#x27;Products, shops, creators UI&#x27;,&#x27;Code-derived&#x27;,&#x27;Resource pages issue JSON API requests and render list/detail data. Server registers resource handlers and injects repositories backed by the main PG pool when available.&#x27;,&#x27;Examples&#x27;,&#x27;/api/v1/products · /shops · /creators · /brands&#x27;],
        &#x27;edge-commerce-pg&#x27;:[&#x27;Commerce APIs → PostgreSQL repositories&#x27;,&#x27;Code-derived&#x27;,&#x27;The Go API wires product, shop, creator, brand, hooks, insights and auth repositories over its primary pgx pool. Queries target deviantly.* schemas. Valv’s current PG exposed-resource list is partial and omits those core names.&#x27;,&#x27;Caveat&#x27;,&#x27;Code query target does not prove Valv exposure or live row availability.&#x27;],
        &#x27;pg-repos&#x27;:[&#x27;Primary PostgreSQL repositories&#x27;,&#x27;Code-derived&#x27;,&#x27;Go pgx pool configured to 25 max and 8 min connections; startup prewarms and pings. Repositories query deviantly.* app schemas. If initial connect fails the server starts with nil repositories; parts of the app return empty results or use handler/service fallback behavior.&#x27;,&#x27;Code entry point&#x27;,&#x27;deviantly-server/internal/db/db.go&#x27;],
        &#x27;ui-live&#x27;:[&#x27;Live Feed UI&#x27;,&#x27;Code-derived&#x27;,&#x27;The page requests /api/v1/live-feed and /stats and also has client polling. API responses combine query results and cache state; “live” describes the product view, not necessarily an event push stream.&#x27;,&#x27;Request style&#x27;,&#x27;HTTP polling; no SSE/WebSocket evidenced for these reads&#x27;],
        &#x27;edge-live-ch&#x27;:[&#x27;Live feed → ClickHouse&#x27;,&#x27;Code-derived&#x27;,&#x27;Go client sends ClickHouse HTTP SQL for counts, windows and feed rows. It caches page-one and range results, plus global viral rows, to avoid repeating large queries.&#x27;,&#x27;Read examples&#x27;,&#x27;videos · youtube_shorts · instagram_reels · videos_500plus · youtube_shorts_1000plus&#x27;],
        &#x27;livefeed-service&#x27;:[&#x27;Live feed query + cache&#x27;,&#x27;Code-derived&#x27;,&#x27;Go client owns HTTP credentials via environment configuration, an HTTP timeout, in-memory page/range caches, sampled counts/rate smoothing and periodically refreshed viral rows. UI pulls results; these code paths are not a Kafka consumer.&#x27;,&#x27;Operations note&#x27;,&#x27;Per-process cache is not shared between API replicas.&#x27;],
        &#x27;landing&#x27;:[&#x27;Public marketing site&#x27;,&#x27;Code-derived&#x27;,&#x27;SvelteKit build is served by Express. Express serves static assets and handles /api/v1/demo, /waitlist and /health. This service is separate from the React application/API router.&#x27;,&#x27;Express port&#x27;,&#x27;Default 6180 (environment override supported)&#x27;],
        &#x27;edge-landing-pg&#x27;:[&#x27;Landing forms → PostgreSQL&#x27;,&#x27;Code-derived&#x27;,&#x27;Demo requests validate and normalize fields, deduplicate by email over 15 minutes, insert a booking, optionally insert a waitlist row, then return a response. Waitlist insert is idempotent. Optional external webhook is asynchronous and its failure does not undo the booking.&#x27;,&#x27;Limits&#x27;,&#x27;Body JSON cap 100 KB; IP-based in-memory limits per process.&#x27;],
        &#x27;landing-pg&#x27;:[&#x27;Landing PostgreSQL&#x27;,&#x27;Code-derived&#x27;,&#x27;Landing Express uses its own DATABASE_URL pool. Form tables are bookings and waitlist. This path is separate from the app’s primary and EchoTik database pools.&#x27;,&#x27;Source&#x27;,&#x27;deviantly-landing-page/server.js&#x27;],
        &#x27;kafka-topics&#x27;:[&#x27;Event publishers / topics&#x27;,&#x27;Code-derived&#x27;,&#x27;Shorts extractor defines youtube.shorts and youtube.creators topic flows and publishes keyed JSON payloads. TikTok Shop includes an outbox publisher script. Other producer helpers exist in the Go crawler family, but several default disabled.&#x27;,&#x27;Critical boundary&#x27;,&#x27;Kafka broker operation and exact consumers are not proven by this repository scan.&#x27;],
        &#x27;edge-topic-raw&#x27;:[&#x27;Kafka topic → raw resource&#x27;,&#x27;Connection inferred&#x27;,&#x27;Valv exposes kafka_video_discovered and sibling resources with raw payload fields; source code publishes Kafka topics. Exact topic names, consumer identity, broker routing and landing-table mapping require deployment config or DDL.&#x27;,&#x27;Status&#x27;,&#x27;Do not treat similar names as a proven connection.&#x27;],
        &#x27;raw-events&#x27;:[&#x27;Raw event resources&#x27;,&#x27;Database-verified&#x27;,&#x27;Valv confirms raw Kafka-named tables; kafka_video_discovered exposes a raw string. This proves the resource and shape, not whether the source is a Kafka engine, a replicated sink, or another ingest mechanism.&#x27;,&#x27;Example&#x27;,&#x27;kafka_video_discovered(raw String)&#x27;],
        &#x27;edge-raw-mv&#x27;:[&#x27;Raw resource → parsed view&#x27;,&#x27;Connection inferred&#x27;,&#x27;The catalog contains parallel kafka_* and mv_kafka_* names, and the latter expose typed fields. This is consistent with parse/normalize materialized views, but Valv does not expose definitions or declared relations.&#x27;,&#x27;Needed to verify&#x27;,&#x27;SHOW CREATE TABLE / view and source pipeline configuration&#x27;],
        &#x27;materialized&#x27;:[&#x27;Parsed event resources&#x27;,&#x27;Database-verified&#x27;,&#x27;Example mv_kafka_video_discovered has UUID id, publish_date, sync timestamp, URL, title, thumbnail, platform/category/country and author fields. Instagram parsed resource mirrors typed reel fields.&#x27;,&#x27;Example resources&#x27;,&#x27;mv_kafka_video_discovered · mv_kafka_instagram_reels&#x27;],
        &#x27;edge-mv-tables&#x27;:[&#x27;Parsed view → serving tables&#x27;,&#x27;Connection inferred&#x27;,&#x27;Valv also exposes videos, youtube_shorts, metrics and analytics tables. Without DDL, data lineage/targets cannot be asserted from object names. Some serving tables may be populated by independent pipelines.&#x27;,&#x27;Status&#x27;,&#x27;Verify MV targets, refresh semantics and deduplication keys.&#x27;],
        &#x27;analytics-targets&#x27;:[&#x27;Serving / analytics tables&#x27;,&#x27;Database-verified&#x27;,&#x27;Catalog includes normalized entities, snapshots, metrics and aggregates, including videos, youtube_shorts, trend_metrics, trend_daily_agg, analytics_daily_agg, and *_500plus / *_1000plus tables.&#x27;,&#x27;Caution&#x27;,&#x27;Some APIs use hard-coded totals or sample fallbacks despite live table data.&#x27;],
        &#x27;event-errors&#x27;:[&#x27;kafka_errors&#x27;,&#x27;Database-verified&#x27;,&#x27;Live Valv description includes event time (at), topic, error text and raw payload. This is a useful central failure surface, but no row-count/freshness conclusion is made here.&#x27;,&#x27;Columns&#x27;,&#x27;at · topic · error · raw&#x27;],
        &#x27;edge-errors&#x27;:[&#x27;Error resources / per-topic MVs&#x27;,&#x27;Connection inferred&#x27;,&#x27;Catalog contains mv_errors_kafka_* resources for multiple source names. Exact view definitions and whether they derive from kafka_errors or raw topic tables are not exposed.&#x27;,&#x27;Status&#x27;,&#x27;Names imply a relationship; need DDL to verify.&#x27;],
        &#x27;error-mvs&#x27;:[&#x27;Per-topic error resources&#x27;,&#x27;Database-verified&#x27;,&#x27;Valv catalog lists per-topic mv_errors_kafka_* resources. Their column contracts and retention cannot be confirmed from the catalog listing alone.&#x27;,&#x27;Examples&#x27;,&#x27;mv_errors_kafka_video_discovered · mv_errors_kafka_youtube_shorts&#x27;],
        &#x27;video-tables&#x27;:[&#x27;Serving tables queried by API&#x27;,&#x27;Code-derived + database-verified&#x27;,&#x27;Video service SQL targets platform-specific ClickHouse resources. Valv confirms rich normalized schemas: TikTok-shaped videos_500plus, YouTube shorts_1000plus, and Instagram reels/metrics.&#x27;,&#x27;Examples&#x27;,&#x27;API code + Valv schema descriptions&#x27;],
        &#x27;edge-video-response&#x27;:[&#x27;ClickHouse rows → UI response&#x27;,&#x27;Code-derived&#x27;,&#x27;Service scans positional rows into a common VideoItem shape (URL, title, thumbnail, platform, category/country, engagement counts, author, publish time). Error/empty result paths can switch tables or return sample rows.&#x27;,&#x27;Response caveat&#x27;,&#x27;Totals are constants in some platform branches.&#x27;],
        &#x27;response-ui&#x27;:[&#x27;Normalized API response&#x27;,&#x27;Code-derived&#x27;,&#x27;Handler serializes service response as JSON; UI state maps it to paginated cards and tables. Thumbnail endpoint is a separate API route.&#x27;,&#x27;Read route&#x27;,&#x27;GET /api/v1/videos&#x27;],
        &#x27;postgres-role&#x27;:[&#x27;PostgreSQL role&#x27;,&#x27;Database-verified&#x27;,&#x27;Valv currently exposes user/account and billing metadata, crawler config/stat resources, Instagram source data, Amazon product metadata and video_stats. It does not expose the main deviantly.* commerce tables in its present catalog.&#x27;,&#x27;Verified examples&#x27;,&#x27;deviantly_users · amazon_product · instagram_reels · tiktok_crawler_configs&#x27;],
        &#x27;clickhouse-role&#x27;:[&#x27;ClickHouse role&#x27;,&#x27;Database-verified&#x27;,&#x27;Large analytical catalog with raw event-like resources, normalized video and creator tables, hourly/daily snapshots, trend analytics and serving tables. API code executes analytical reads here for Video and Live Feed.&#x27;,&#x27;App writes&#x27;,&#x27;No direct Go API write into the ClickHouse serving tables was established in reviewed paths.&#x27;],
        &#x27;partial-catalog&#x27;:[&#x27;Partial PostgreSQL visibility&#x27;,&#x27;Database-verified&#x27;,&#x27;Valv exposes 15 resource names in the currently connected PostgreSQL datasource. Core Go repository references include deviantly.products, shop, creators and amazon_products, but these are not in that exposed list. Catalog absence is not proof that the tables are absent from the database.&#x27;,&#x27;Interpretation&#x27;,&#x27;Live schema conclusions are bounded to Valv’s exposed connection/catalog.&#x27;],
        &#x27;yt-crawler&#x27;:[&#x27;YouTube Go crawler&#x27;,&#x27;Code-derived&#x27;,&#x27;Channel and short crawlers use disk shards/JSONL and a shared Bloom-filter dedupe strategy. Kafka flags exist but default false. The Rust extractor’s default glob reads channel shard IDs from data/*.txt.&#x27;,&#x27;Source&#x27;,&#x27;Youtube-Crawler/src/*crawler.go&#x27;],
        &#x27;edge-yt-files&#x27;:[&#x27;Channel shard file handoff&#x27;,&#x27;Code-derived&#x27;,&#x27;Go channel crawler writes rolling tier shard text files; Rust extractor reads matching text files and treats each valid 24-byte UC-prefixed line as a channel.&#x27;,&#x27;Files&#x27;,&#x27;data/tier-*.txt → extractor data/*.txt&#x27;],
        &#x27;yt-extractor&#x27;:[&#x27;Rust YouTube Shorts extractor&#x27;,&#x27;Code-derived&#x27;,&#x27;Startup applies idempotent schema.sql, scans each channel shard with saved per-file state, queries current Shorts, records new IDs, then enriches shorts and refreshes creator metadata. Concurrency/proxy controls are configurable.&#x27;,&#x27;Stages&#x27;,&#x27;scan → Postgres insert → enrich → publish&#x27;],
        &#x27;edge-yt-pg&#x27;:[&#x27;Extractor → staging rows&#x27;,&#x27;Code-derived&#x27;,&#x27;Scanner inserts new video_id/channel_id rows in batches. Enricher fetches metadata and updates shorts; creator refresh is skipped when fresh and writes daily creator stats.&#x27;,&#x27;Retry behavior&#x27;,&#x27;Scan state, enrichment error/attempt fields and upserts are source-backed.&#x27;],
        &#x27;yt-pg&#x27;:[&#x27;YouTube extractor PostgreSQL&#x27;,&#x27;Code-derived&#x27;,&#x27;Schema is applied at process startup and contains youtube_shorts/youtube_creators plus publish markers. This extractor’s DB is not shown to be the same schema/pool as the Go app’s primary DB.&#x27;,&#x27;Important distinction&#x27;,&#x27;The extractor’s Postgres rows are not the same name as ClickHouse youtube_shorts.&#x27;],
        &#x27;edge-yt-kafka&#x27;:[&#x27;PG staged rows → Kafka&#x27;,&#x27;Code-derived&#x27;,&#x27;Publisher selects enriched rows missing a published marker, sends keyed records with acks/idempotence enabled, and only then stores the Kafka acknowledgement time. Crash after broker ack before PG mark can resend; consumers must deduplicate.&#x27;,&#x27;Delivery&#x27;,&#x27;At least once, duplicate tolerant&#x27;],
        &#x27;yt-kafka&#x27;:[&#x27;YouTube topics&#x27;,&#x27;Code-derived&#x27;,&#x27;Rust flows publish video and creator events to youtube.shorts and youtube.creators. Publisher loops retry after failures and recreate a producer on fatal state.&#x27;,&#x27;Source&#x27;,&#x27;youtube-short-extractor/src/publish.rs&#x27;],
        &#x27;edge-yt-ch&#x27;:[&#x27;YouTube topic → ClickHouse&#x27;,&#x27;Unresolved pipeline gap&#x27;,&#x27;ClickHouse catalog has YouTube raw/parsed/serving resources and the API reads youtube_shorts_1000plus. Repository source establishes the producer topics, but not which consumer reads them, how rows are transformed, or whether this topic is the source.&#x27;,&#x27;Need&#x27;,&#x27;Consumer repo/config + ClickHouse DDL + Kafka topic mapping&#x27;],
        &#x27;youtube-serving&#x27;:[&#x27;YouTube API read table&#x27;,&#x27;Database-verified + code-derived&#x27;,&#x27;Valv schema describes id/date/channel/title/description/category/keywords and engagement counts. Go video service queries youtube_shorts_1000plus. This confirms a serving schema/read path, not that the extractor publisher populates it.&#x27;,&#x27;Table&#x27;,&#x27;default.youtube_shorts_1000plus&#x27;],
        &#x27;tt-shop-crawler&#x27;:[&#x27;TikTok Shop crawler&#x27;,&#x27;Code-derived&#x27;,&#x27;Separate Node crawler/enricher project. Enriched entities use transactional PostgreSQL upserts and enqueue outbox events in the same transaction where code calls the helper.&#x27;,&#x27;Entity groups&#x27;,&#x27;seller · product · video · creator&#x27;],
        &#x27;edge-tt-pg&#x27;:[&#x27;Crawler → tiktok_shop PostgreSQL&#x27;,&#x27;Code-derived&#x27;,&#x27;Repository includes migration DDL and DB helper SQL for tiktok_shop entities and kafka_outbox. Do not confuse this schema with the Go API’s deviantly.* repositories.&#x27;,&#x27;Evidence&#x27;,&#x27;TikTok-Shop-Crawler/database/*.sql · src/utils/db.js&#x27;],

 {id:&#x27;SEC-002&#x27;,title:&#x27;Image proxy can make server-side requests to arbitrary HTTP URLs&#x27;,category:&#x27;Security&#x27;,severity:&#x27;High&#x27;,status:&#x27;Strongly indicated&#x27;,confidence:&#x27;High&#x27;,effort:&#x27;Small&#x27;,effortWhy:&#x27;A focused URL policy and redirect checks fit one handler; regression tests cover the edge cases.&#x27;,nodes:[&#x27;api&#x27;],evidence:[&#x27;deviantly-server/internal/media/handler.go:47-60 (GET /proxy is registered)&#x27;,&#x27;deviantly-server/internal/media/handler.go:106-116 (only scheme prefix checked)&#x27;,&#x27;deviantly-server/internal/media/handler.go:126 onward (server fetch)&#x27;],explanation:&#x27;The public route accepts a caller-supplied URL and performs a server-side fetch. Scheme validation alone does not exclude loopback, private, link-local, metadata, or redirect targets.&#x27;,impact:&#x27;Could expose internal services or consume server resources through crafted requests.&#x27;,root:&#x27;No visible host/IP allowlist or redirect revalidation at the request boundary.&#x27;,recommendation:&#x27;Allow only approved media hostnames; resolve and reject non-public IPs; revalidate redirects; cap response size and accepted image MIME types; add per-user/IP rate limits.&#x27;,plan:&#x27;Add URL parsing/host policy before fetch; pin/revalidate resolved addresses and redirect destinations; test private IPv4/IPv6 and redirect cases; monitor blocked requests.&#x27;,benefit:&#x27;Restricts proxy egress to expected image origins.&#x27;,risk:&#x27;Legitimate CDN host changes can fail closed until allowlists are updated.&#x27;,validation:&#x27;Unit tests for private, loopback, IPv6, redirect, malformed URL and allowed CDN cases.&#x27;,priority:2,phase:&#x27;Immediate fixes&#x27;,criteria:&#x27;Only approved public media endpoints can be fetched and all redirects are revalidated.&#x27;},
 {id:&#x27;REL-001&#x27;,title:&#x27;Health endpoint reports healthy without checking dependencies&#x27;,category:&#x27;Reliability&#x27;,severity:&#x27;Medium&#x27;,status:&#x27;Confirmed&#x27;,confidence:&#x27;High&#x27;,effort:&#x27;Small&#x27;,effortWhy:&#x27;Separate liveness/readiness handlers and bounded dependency checks are localized API work.&#x27;,nodes:[&#x27;api&#x27;,&#x27;pgapp&#x27;,&#x27;ch&#x27;,&#x27;echo&#x27;],evidence:[&#x27;deviantly-server/cmd/api/main.go:72-77 (API continues if PostgreSQL connection fails)&#x27;,&#x27;deviantly-server/cmd/api/main.go:98-103 (/health returns healthy unconditionally)&#x27;,&#x27;deviantly-server/internal/db/db.go:51-54 (ping failure returns pool)&#x27;],explanation:&#x27;The process can run with unavailable databases while /health still returns healthy. Load balancers and operators cannot distinguish process liveness from serving readiness.&#x27;,impact:&#x27;Traffic may be routed to a process whose data-backed endpoints are degraded or returning fallback content.&#x27;,root:&#x27;One health response conflates process liveness and dependency readiness.&#x27;,recommendation:&#x27;Keep liveness independent, add readiness that checks required stores with short bounded timeouts, and report degraded optional dependencies explicitly.&#x27;,plan:&#x27;Define required dependencies per route group; expose separate /live and /ready semantics; add handler-level dependency outage tests and deployment probe config.&#x27;,benefit:&#x27;Improves failure detection and avoids routing requests to unusable instances.&#x27;,risk:&#x27;Readiness checks must stay bounded and avoid turning transient optional outages into restart loops.&#x27;,validation:&#x27;Simulate unavailable Postgres/ClickHouse and confirm readiness changes while process liveness remains available.&#x27;,priority:3,phase:&#x27;Immediate fixes&#x27;,criteria:&#x27;Readiness status matches the stores required for configured API functionality.&#x27;},
 {id:&#x27;DATA-001&#x27;,title:&#x27;Product endpoints can return fixture/mock content when the repository is unavailable&#x27;,category:&#x27;Data quality&#x27;,severity:&#x27;Medium&#x27;,status:&#x27;Confirmed&#x27;,confidence:&#x27;High&#x27;,effort:&#x27;Small&#x27;,effortWhy:&#x27;Remove fallback branches and cover nil/missing-data cases in the existing handler tests.&#x27;,nodes:[&#x27;api&#x27;,&#x27;pgapp&#x27;,&#x27;ui&#x27;],evidence:[&#x27;deviantly-server/cmd/api/main.go:106-123 (repositories only constructed when pool exists)&#x27;,&#x27;deviantly-server/internal/product/handler.go:151-166 (List uses MockTrendingProducts)&#x27;,&#x27;deviantly-server/internal/product/handler.go:169-185 (detail fixture fallback)&#x27;],explanation:&#x27;If the database pool is nil, selected product handlers serve in-memory sample content; a detail lookup can also use fixture JSON after repository lookup fails. This conflicts with the server rule requiring real data/empty responses.&#x27;,impact:&#x27;Users may mistake synthetic products or details for live catalog data, undermining decisions and trust.&#x27;,root:&#x27;Handlers use fixtures when no repository or when a record lookup fails.&#x27;,recommendation:&#x27;Return an explicit unavailable/error response when the database is unavailable and an empty/404 response for absent records. Keep fixtures in tests only.&#x27;,plan:&#x27;Remove production handler fallback branches and mock imports; add tests for nil repository and missing row; verify frontend displays empty/error state.&#x27;,benefit:&#x27;Prevents synthetic records from appearing as production data.&#x27;,risk:&#x27;Some local/demo flows may have relied on fallback data and will need an explicit test fixture path.&#x27;,validation:&#x27;API tests assert no fabricated payload is returned with nil repo or missing row.&#x27;,priority:4,phase:&#x27;Immediate fixes&#x27;,criteria:&#x27;Production handlers never serve mock/fixture payloads.&#x27;},
 {id:&#x27;PERF-001&#x27;,title:&#x27;Several Kafka groups had measurable backlog in the sampled snapshot&#x27;,category:&#x27;Performance&#x27;,severity:&#x27;Medium&#x27;,status:&#x27;Confirmed snapshot; cause unknown&#x27;,confidence:&#x27;Medium&#x27;,effort:&#x27;Medium&#x27;,effortWhy:&#x27;Requires several time-window samples plus ownership/configuration tracing across the consumer boundary.&#x27;,nodes:[&#x27;kafka&#x27;,&#x27;consumer&#x27;,&#x27;ch&#x27;],evidence:[&#x27;Connected ClickHouse resource kafka_consumer_lag, snapshot at 2026-10-12 03:46 UTC&#x27;,&#x27;tracker-phase2 / tracker.phase2.due: total lag 15,325; max partition 4,223; 6 partitions&#x27;,&#x27;ch_author_upserted_c2 / author.upserted: total 6,275; max 1,648; 4 partitions&#x27;,&#x27;ch_video_snapshot_c2 / video.snapshot: total 5,720; max 661; 12 partitions&#x27;,&#x27;Other sampled groups include video.metrics 3,793 and video.discovered 3,424&#x27;],explanation:&#x27;The catalog contains non-zero lag in several groups at one timestamp. Without consecutive snapshots, arrival rate, processing rate, and retention context, this cannot establish stale data or a scaling bottleneck.&#x27;,impact:&#x27;If backlog is persistent or rising, downstream analytics may be delayed; current user-visible effect is unknown.&#x27;,root:&#x27;Not established. Consumer implementation/configuration was not located in inspected source paths.&#x27;,recommendation:&#x27;Capture lag over time with produce/consume rates and event age; identify group owners; investigate the highest sustained lag and partition skew before changing concurrency or partitions.&#x27;,plan:&#x27;Verify units and timestamp semantics; collect rolling snapshots; compare each partition’s lag slope and oldest event age; trace group config and sink errors; set actionable alert thresholds.&#x27;,benefit:&#x27;Separates transient queue depth from sustained consumer capacity problems.&#x27;,risk:&#x27;Adding consumers or partitions without ownership/key analysis can increase contention or break ordering.&#x27;,validation:&#x27;Show lag and oldest-event-age trends stabilize within an explicitly chosen service objective.&#x27;,priority:5,phase:&#x27;Structural improvements&#x27;,criteria:&#x27;Group owners and sustained backlog behavior are known; alert thresholds are tied to a freshness objective.&#x27;},
 {id:&#x27;ARCH-001&#x27;,title:&#x27;Connected database catalog and backend schema targets do not line up&#x27;,category:&#x27;Architecture&#x27;,severity:&#x27;Medium&#x27;,status:&#x27;Unknown due to environment identity&#x27;,confidence:&#x27;Medium&#x27;,effort:&#x27;Small&#x27;,effortWhy:&#x27;Mostly a read-only environment mapping and schema/DDL review; access to deployment metadata may extend it.&#x27;,nodes:[&#x27;api&#x27;,&#x27;pgapp&#x27;,&#x27;ch&#x27;],evidence:[&#x27;deviantly-server/internal/db/db.go:15-21 expects virlo_metadata and queries deviantly.products&#x27;,&#x27;Connected Postgres catalog namespace: public; resources include deviantly_users, instagram_reels and tiktok_crawler_stats; no products resource listed&#x27;,&#x27;Backend video service references ClickHouse default.videos_500plus / videos_flat&#x27;,&#x27;Connected ClickHouse catalog lists resources in public namespace, including videos and kafka_* tables&#x27;],explanation:&#x27;The observed connector catalogs and source-code schema/resource names differ. The datasource may target another environment or expose remapped resources; current evidence cannot prove a production schema drift.&#x27;,impact:&#x27;Architecture findings, table/index recommendations and operational metrics could be attributed to the wrong database if environment identity is assumed.&#x27;,root:&#x27;Datasource identity/configuration mapping is not documented in the inspected workspace context.&#x27;,recommendation:&#x27;Record non-secret datasource identity (environment, logical DB, schema mapping) and reconcile source configuration with catalog resources before deeper tuning.&#x27;,plan:&#x27;Compare sanitized host/database/schema identifiers with the deployed API environment; inspect migration state and ClickHouse DDL read-only; document confirmed ownership and ingestion mappings.&#x27;,benefit:&#x27;Prevents changes against the wrong database and makes subsequent audit conclusions reliable.&#x27;,risk:&#x27;Low; access to deployment metadata may be needed.&#x27;,validation:&#x27;A reviewed mapping ties each source DSN variable to a named environment and catalog/schema.&#x27;,priority:6,phase:&#x27;Structural improvements&#x27;,criteria:&#x27;Source targets and connected metadata are reconciled; unmatched objects have an owner or explanation.&#x27;}];
